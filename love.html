<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
}

#heart-container{
    animation: heartbeat 2.5s ease-in-out infinite;
}

@keyframes heartbeat{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
    100%{
        transform:scale(1);
    }
}

.word{
    position:absolute;
    color:#ff3366;
    font-size:22px;
    font-weight:bold;
    white-space:nowrap;
    animation: colorChange 3s infinite;
}

@keyframes colorChange{
    0%{
        color:#ff3366;
        text-shadow:0 0 10px #ff3366;
    }

    50%{
        color:#ffffff;
        text-shadow:0 0 25px #ff66cc;
    }

    100%{
        color:#ff3366;
        text-shadow:0 0 10px #ff3366;
    }
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:0.2;
    }
    to{
        opacity:1;
        box-shadow:0 0 10px white;
    }
}
.love-particle{
    position:absolute;
    font-size:28px;
    pointer-events:none;
    animation: floatUp 4s linear forwards;
}

@keyframes floatUp{
    0%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(20px,-100px) scale(1.3);
    }

    100%{
        opacity:0;
        transform:translate(-20px,-200px) scale(1.8);
    }
}

</style>
</head>
<body>

<div id="heart-container"></div>

<script>
const text = "I LOVE YOU ❤️ ";
const total = 60;
const items = [];

const container = document.getElementById("heart-container");

for(let i=0;i<150;i++){
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * window.innerWidth + "px";

    const startY = Math.random() * window.innerHeight;
    star.style.top = startY + "px";

    star.dataset.y = startY;

    star.style.animationDuration =
        (1 + Math.random() * 3) + "s";

    document.body.appendChild(star);
}

for(let i=0;i<total;i++){
    const span = document.createElement("span");
    span.className = "word";
    span.innerText = text;

    container.appendChild(span);
    items.push(span);
}

let t = 0;

function animate(){
    t += 0.0015;

    items.forEach((item, i) => {
        const a = (i / total) * Math.PI * 2 + t;

        const x = 16 * Math.pow(Math.sin(a), 3);
        const y = -(13 * Math.cos(a)
                - 5 * Math.cos(2*a)
                - 2 * Math.cos(3*a)
                - Math.cos(4*a));

        const scale = 15;

        item.style.left =
            window.innerWidth / 2 + x * scale + "px";

        item.style.top =
            window.innerHeight / 2 + y * scale + "px";
    });

    document.querySelectorAll('.star').forEach(star => {

    let y = parseFloat(star.dataset.y);

    y += 0.15;

    if(y > window.innerHeight){
        y = 0;
    }

    star.style.top = y + "px";
    star.dataset.y = y;

});

    requestAnimationFrame(animate);
}
setInterval(() => {

    const love = document.createElement("div");
    love.className = "love-particle";
    love.innerHTML = "❤️";

   const randomItem = items[Math.floor(Math.random() * items.length)];

love.style.left = randomItem.style.left;
love.style.top = randomItem.style.top;

    document.body.appendChild(love);

    setTimeout(()=>{
        love.remove();
    },4000);

},50);

animate();
</script>

</body>
</html>
