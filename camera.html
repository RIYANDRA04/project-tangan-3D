<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Gesture Blur Camera HD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0e15;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #webcam {
      display: none;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      /* PENTING: contain biar gak kepotong/ngezoom sama sekali */
      object-fit: contain; 
      transform: scaleX(-1);
    }

    .blurred {
      filter: blur(20px);
      transition: filter 0.1s ease;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline></video>

  <div class="video-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');

    function isPeaceGesture(landmarks) {
      const indexUp = landmarks[8].y < landmarks[6].y;
      const middleUp = landmarks[12].y < landmarks[10].y;
      const ringDown = landmarks[16].y > landmarks[14].y;
      
      return indexUp && middleUp && ringDown;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0,
      minDetectionConfidence: 0.3,
      minTrackingConfidence: 0.3
    });

    hands.onResults((results) => {
      // Sesuaikan ukuran canvas dengan resolusi asli video webcam biar gak melar/blur
      if (canvasElement.width !== results.image.width) {
        canvasElement.width = results.image.width;
        canvasElement.height = results.image.height;
      }

      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      let isPeace = false;
      if (results.multiHandLandmarks) {
        for (const landmarks of results.multiHandLandmarks) {
          if (isPeaceGesture(landmarks)) {
            isPeace = true;
            break;
          }
        }
      }

      if (isPeace) {
        canvasElement.classList.add('blurred');
      } else {
        canvasElement.classList.remove('blurred');
      }

      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
